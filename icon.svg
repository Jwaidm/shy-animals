<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3b2e"/>
      <stop offset="55%" stop-color="#2f5e47"/>
      <stop offset="100%" stop-color="#183025"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#f7ebb2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7ebb2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="210" fill="url(#glow)"/>
  <!-- Distant pines -->
  <path d="M96 370 L146 210 L196 370 Z" fill="#1b382b" opacity="0.85"/>
  <path d="M316 370 L368 195 L420 370 Z" fill="#1b382b" opacity="0.85"/>
  <path d="M40 390 L95 250 L150 390 Z" fill="#152d22"/>
  <path d="M362 390 L418 245 L474 390 Z" fill="#152d22"/>
  <!-- Mossy ground -->
  <ellipse cx="256" cy="430" rx="280" ry="115" fill="#3e7450"/>
  <ellipse cx="256" cy="455" rx="260" ry="95" fill="#2a5439"/>
  <!-- Cute Roe Deer head & neck peeking from ferns -->
  <g transform="translate(256, 290)">
    <!-- Ears -->
    <ellipse cx="-52" cy="-78" rx="18" ry="38" transform="rotate(-32 -52 -78)" fill="#b86b3d"/>
    <ellipse cx="-50" cy="-76" rx="10" ry="25" transform="rotate(-32 -50 -76)" fill="#edd0b7"/>
    <ellipse cx="52" cy="-78" rx="18" ry="38" transform="rotate(32 52 -78)" fill="#b86b3d"/>
    <ellipse cx="50" cy="-76" rx="10" ry="25" transform="rotate(32 50 -76)" fill="#edd0b7"/>
    <!-- Neck -->
    <path d="M-32 85 L-24 -20 L24 -20 L34 85 Z" fill="#b86b3d"/>
    <path d="M-14 85 L-10 -10 L10 -10 L14 85 Z" fill="#edd5bc"/>
    <!-- Head -->
    <ellipse cx="0" cy="-38" rx="46" ry="50" fill="#c57646"/>
    <ellipse cx="0" cy="-14" rx="26" ry="24" fill="#f0dbc3"/>
    <!-- Eyes -->
    <circle cx="-22" cy="-44" r="7.5" fill="#211610"/>
    <circle cx="-24" cy="-46.5" r="2.5" fill="#ffffff"/>
    <circle cx="22" cy="-44" r="7.5" fill="#211610"/>
    <circle cx="20" cy="-46.5" r="2.5" fill="#ffffff"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-10" rx="11" ry="8" fill="#281a14"/>
  </g>
  <!-- Foreground ferns -->
  <path d="M56 440 Q130 350 215 410 Q140 425 56 440 Z" fill="#4f8c5c"/>
  <path d="M456 440 Q382 350 297 410 Q372 425 456 440 Z" fill="#4f8c5c"/>
  <!-- Fireflies -->
  <circle cx="155" cy="155" r="6" fill="#fff4a8"/>
  <circle cx="362" cy="142" r="5" fill="#fff4a8"/>
  <circle cx="290" cy="108" r="4" fill="#fff4a8"/>
</svg>
